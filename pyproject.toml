[project]
name = "stewart-agent"
version = "0.1.0"
description = "Agentic MCU continuity stewardship vertical slice"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "parallel-web>=1.1.0,<2.0.0",
    "pydantic>=2.10,<3.0.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
stewart = "stewart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stewart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires live Gemini and Parallel credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
